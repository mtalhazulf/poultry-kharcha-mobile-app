name: Android

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

  apk:
    name: Release APK
    needs: check
    # Every push builds the APK so Gradle/native problems surface in CI even
    # when nobody has an Android SDK locally; artifacts are kept 30 days.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle', 'bun.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Create .env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          OAUTH_REDIRECT_URL: ${{ secrets.OAUTH_REDIRECT_URL }}
        run: |
          {
            echo "SUPABASE_URL=${SUPABASE_URL:-https://ikiepqpfhmdprqezrbgq.supabase.co}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-sb_publishable_1WZX331OhkRu_rc-PFkTWw_jfCDPJQB}"
            echo "GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID:-}"
            echo "OAUTH_REDIRECT_URL=${OAUTH_REDIRECT_URL:-kharcha://auth/callback}"
          } > .env

      - name: Configure release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/kharcha-release.keystore
          {
            echo "storeFile=kharcha-release.keystore"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS:-kharcha}"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > android/keystore.properties

      - name: Note unsigned build
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 not set - release APK will be signed with the debug keystore."

      - run: chmod +x android/gradlew

      - name: Build release APK
        run: bun run apk:release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  smoke:
    name: Emulator smoke run
    needs: apk
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # publishes screenshots to the ci-screenshots branch
    env:
      # Throwaway demo account seeded in the Supabase project; override with
      # repo secrets to point at a different user/project.
      SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL || 'demo@kharcha.test' }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD || 'KharchaDemo!2026' }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: apk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: ~/.android/avd/*
          key: avd-34-x86_64-google_apis

      - name: Run the app on an emulator and drive it with Maestro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          # Each line of `script` runs in its own shell, so the driver lives in a file.
          script: bash scripts/ci-smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots-${{ github.sha }}
          path: |
            screenshots/*.png
            maestro-debug/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

      # Artifacts need a browser session to download; a branch can be fetched
      # from anywhere with git. Orphan branch, force-pushed, one commit per run.
      - name: Publish screenshots to the ci-screenshots branch
        if: always()
        run: |
          # Maestro writes takeScreenshot output into its (hidden) test-output
          # folder under --debug-output, not the cwd; gather PNGs from both.
          staging="$(mktemp -d)"
          find screenshots maestro-debug -type f -name '*.png' -exec cp {} "$staging"/ \; 2>/dev/null || true
          if ! ls "$staging"/*.png >/dev/null 2>&1; then
            echo "No screenshots to publish"
            find screenshots maestro-debug -type f 2>/dev/null | head -50
            exit 0
          fi
          mkdir -p "$staging/logs"
          find maestro-debug -type f \( -name '*.log' -o -name '*.txt' -o -name '*.json' \) -exec cp {} "$staging/logs"/ \; 2>/dev/null || true
          ls -la "$staging"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan ci-screenshots
          git rm -rfq . >/dev/null 2>&1 || true
          git clean -fdxq   # drop untracked build inputs (apk/, maestro-debug/, …)
          cp -r "$staging"/. .
          {
            echo "# Smoke-run screenshots"
            echo
            echo "- Source commit: \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Result: ${{ job.status }}"
          } > README.md
          git add -A
          git commit -qm "Smoke screenshots for ${GITHUB_SHA} (${{ job.status }})"
          git push -f origin ci-screenshots
