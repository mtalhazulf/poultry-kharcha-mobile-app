# End-to-end smoke run against the live Supabase project.
#   maestro test .maestro/smoke.yaml -e EMAIL=... -e PASSWORD=...
# Screenshots land in the current working directory.
appId: com.kharcha.app
---
- launchApp:
    clearState: true
# If an "isn't responding" system dialog is still showing, wait it out.
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "Kharcha"
    timeout: 60000
- takeScreenshot: 01-login

# Sign in with the seeded demo account
- tapOn:
    id: "login-email"
- inputText: ${EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit"

# First run on this device: the walkthrough shows before the dashboard
- extendedWaitUntil:
    visible: "Welcome to Kharcha"
    timeout: 45000
- takeScreenshot: 02-walkthrough-1
- tapOn:
    id: "walkthrough-next"
- assertVisible: "Add an expense"
- takeScreenshot: 02-walkthrough-2
- tapOn:
    id: "walkthrough-next"
- assertVisible: "Keep the bill"
- tapOn:
    id: "walkthrough-next"
- assertVisible: "Share with a colleague"
- takeScreenshot: 02-walkthrough-4
- tapOn:
    id: "walkthrough-next"
- assertVisible: "Settings"
- takeScreenshot: 02-walkthrough-5
- tapOn:
    id: "walkthrough-next"

- extendedWaitUntil:
    visible: "This month"
    timeout: 45000
- takeScreenshot: 03-dashboard

# Create an expense
- tapOn:
    id: "dashboard-fab"
- extendedWaitUntil:
    visible: "Amount"
    timeout: 15000
- tapOn:
    id: "form-amount"
- inputText: "1250.50"
- hideKeyboard
- takeScreenshot: 04-form-amount
- tapOn:
    id: "category-Feed"
# The note field sits below the category grid; scroll it into view first.
- scrollUntilVisible:
    element:
      id: "form-note"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "form-note"
- inputText: "Biryani for the team"
- hideKeyboard
- takeScreenshot: 04-form-filled
- tapOn:
    id: "form-submit"

# Detail screen (navigation.replace after create)
- extendedWaitUntil:
    visible:
      id: "detail-amount"
    timeout: 45000
- assertVisible: "PKR 1,250.50"
- assertVisible: "Biryani for the team"
- takeScreenshot: 05-detail

# Back to the dashboard: the new row must be listed (RLS-scoped query + realtime)
- back
- extendedWaitUntil:
    visible: "Biryani for the team"
    timeout: 20000
- takeScreenshot: 06-dashboard-with-expense

# Clean up: delete the expense this run created (owner-only delete via RLS).
- tapOn: "Biryani for the team"
- extendedWaitUntil:
    visible:
      id: "detail-amount"
    timeout: 30000
- tapOn: "Delete"
- assertVisible: "Delete expense?"
- tapOn: "Yes, delete"
- extendedWaitUntil:
    visible: "This month"
    timeout: 30000
- assertNotVisible: "Biryani for the team"
- takeScreenshot: 07-dashboard-after-delete

# Settings: the demo account is a member, so this shows the read-only
# expense-type list plus Help / Sign out.
- tapOn:
    id: "open-settings"
- extendedWaitUntil:
    visible: ".*Expense types.*"
    timeout: 20000
- takeScreenshot: 08-settings
- back
- extendedWaitUntil:
    visible: "This month"
    timeout: 20000
